name: Build hosts

# Один и тот же проект собирается на macOS, Linux и Windows (Git Bash/MSYS2).
# Цель сборки одна — Windows 7 x64 (там работает служба печати), но
# разработчик/CI не привязан к конкретной ОС.
#
# Проверяем: кросс-компиляция exe, отсутствие CRT-зависимостей, сборка
# расширения, единый архив PrintNum-<ver>-windows.zip с manifest.json внутри.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: hosts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
            setup: |
              sudo apt-get update -qq
              sudo apt-get install -y -qq mingw-w64 zip unzip >/dev/null
          - os: macos-latest
            name: macOS
            setup: |
              brew install mingw-w64 >/dev/null 2>&1 || brew upgrade mingw-w64 >/dev/null 2>&1 || true
          - os: windows-latest
            name: Windows (MSYS2)
            msys2: true
            setup: ""

    steps:
      - uses: actions/checkout@v7

      # Windows: MinGW + zip из MSYS2 (bash тоже оттуда).
      - name: MSYS2 (Windows)
        if: matrix.msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            zip
            unzip

      - name: Тулчейн (Linux/macOS)
        if: ${{ !matrix.msys2 }}
        run: ${{ matrix.setup }}

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cPrintNum/extension/package-lock.json

      - name: Зависимости расширения
        shell: bash
        working-directory: cPrintNum/extension
        run: npm ci

      - name: Сборка (build.sh)
        shell: bash
        working-directory: cPrintNum
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Проверки архива и exe
        shell: bash
        working-directory: cPrintNum
        run: |
          set -euo pipefail
          ZIP=$(ls dist/PrintNum-*-windows.zip | head -1)
          echo "архив: $ZIP"

          OBJDUMP=$(command -v x86_64-w64-mingw32-objdump || command -v objdump)
          for exe in printnum-win7.exe printnum-diag.exe; do
            # пишем в файл: `objdump | grep -q` под pipefail даёт SIGPIPE (141)
            "$OBJDUMP" -p "$exe" > "objdump-$exe.txt"
            if grep -q api-ms-win-crt "objdump-$exe.txt"; then
              echo "❌ $exe тянет CRT — на чистой Windows 7 не запустится"
              exit 1
            fi
            size=$(stat -c%s "$exe" 2>/dev/null || stat -f%z "$exe")
            echo "✅ $exe без CRT ($size байт)"
          done

          # Функциональная проверка архива: распаковать и убедиться, что
          # структура вложенная. Если бы разделители были "\\", распаковка
          # создала бы один плоский файл, и путей ниже бы не существовало.
          if command -v unzip >/dev/null 2>&1; then
            TMP=$(mktemp -d)
            unzip -q "$ZIP" -d "$TMP"
            for f in PrintNum/extension/manifest.json PrintNum/printnum-win7.exe \
                     PrintNum/config.json PrintNum/README.txt; do
              if [ ! -f "$TMP/$f" ]; then
                echo "❌ после распаковки нет $f"
                find "$TMP" -maxdepth 3 | head -20
                exit 1
              fi
            done
            echo "✅ архив распаковывается во вложенную структуру"
            rm -rf "$TMP"
          else
            echo "⚠️ unzip не найден — проверка содержимого пропущена"
          fi

      - name: Артефакт
        uses: actions/upload-artifact@v7
        with:
          name: windows-build-${{ matrix.name }}
          path: |
            cPrintNum/dist/PrintNum-*-windows.zip
            cPrintNum/extension/output/chrome-mv3
          retention-days: 5
