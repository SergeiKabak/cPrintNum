name: CI

# Что проверяем на каждый push в main и на каждый PR:
#   1. C-служба собирается под Win7 x64 без CRT и без предупреждений;
#   2. расширение проходит tsc + сборку WXT, манифест валиден;
#   3. собранный exe реально работает: 27 smoke-проверок HTTP API под Wine.

on:
  # Любая ветка: проверки нужны и в feature-ветках, не только после мержа.
  push:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGET: x86_64-w64-mingw32

jobs:
  # ---------------------------------------------------------------------------
  server:
    name: C-служба (Win7 x64, без CRT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: MinGW-w64
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mingw-w64 >/dev/null

      - name: Сборка exe
        working-directory: cPrintNum
        run: SKIP_EXTENSION=1 ./build.sh

      - name: Никаких CRT-зависимостей (иначе не заведётся на Win7)
        working-directory: cPrintNum
        run: |
          for exe in printnum-win7.exe printnum-diag.exe; do
            if ${TARGET}-objdump -p "$exe" | grep -q "api-ms-win-crt"; then
              echo "❌ $exe тянет CRT — на чистой Windows 7 не запустится"
              ${TARGET}-objdump -p "$exe" | grep "DLL Name"
              exit 1
            fi
            echo "✅ $exe: $(stat -c%s "$exe") байт"
          done

      - name: Подсистемы Windows (служба — без окна, diag — консоль)
        working-directory: cPrintNum
        run: |
          ${TARGET}-objdump -p printnum-win7.exe | grep -q "Subsystem.*Windows GUI"
          ${TARGET}-objdump -p printnum-diag.exe | grep -q "Subsystem.*Windows CUI"
          echo "✅ subsystem: GUI / CUI"

      - name: "-Wall -Wextra без предупреждений"
        working-directory: cPrintNum
        run: |
          out=$(${TARGET}-gcc -municode -Os -Wall -Wextra -static -nostdlib \
                 -e wWinMain -ffreestanding -fno-builtin -mwindows \
                 -c printnum-win7.c -o /tmp/check.o 2>&1 || true)
          if [ -n "$out" ]; then
            echo "❌ Компилятор предупреждает:"
            echo "$out"
            exit 1
          fi
          echo "✅ 0 предупреждений"

      - name: Артефакты exe
        uses: actions/upload-artifact@v7
        with:
          name: server-exe
          path: |
            cPrintNum/printnum-win7.exe
            cPrintNum/printnum-diag.exe
            cPrintNum/config.json
          retention-days: 7

  # ---------------------------------------------------------------------------
  extension:
    name: Расширение (tsc + WXT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cPrintNum/extension/package-lock.json

      - name: Зависимости
        working-directory: cPrintNum/extension
        run: npm ci

      - name: Типы (tsc --noEmit)
        working-directory: cPrintNum/extension
        run: npm run compile

      - name: Сборка
        working-directory: cPrintNum/extension
        run: npm run build

      - name: "Манифест: версия, лимиты магазина, разрешения"
        working-directory: cPrintNum/extension
        run: |
          node -e '
            const m = require("./output/chrome-mv3/manifest.json");
            const fail = (msg) => { console.error("❌ " + msg); process.exit(1); };
            if (m.manifest_version !== 3) fail("нужен Manifest V3");
            if (!/^\d+\.\d+\.\d+$/.test(m.version)) fail("версия не semver: " + m.version);
            if ([...m.description].length > 132) fail("описание длиннее 132 символов");
            if (!m.icons?.["128"]) fail("нет иконки 128×128");
            const allowed = new Set((m.permissions ?? []).filter((p) => ["storage", "scripting"].includes(p)));
            if (allowed.size !== (m.permissions ?? []).length) fail("лишние permissions: " + m.permissions);
            const hosts = m.host_permissions ?? [];
            if (hosts.some((h) => h.includes("localhost"))) fail("localhost в host_permissions (на macOS отвечает AirPlay)");
            if (hosts.some((h) => h === "<all_urls>" || h === "*://*/*")) fail("слишком широкие host_permissions");
            console.log("✅ манифест ок:", m.name, m.version, JSON.stringify(hosts));
          '

      - name: Пакет для магазинов (manifest.json в корне)
        working-directory: cPrintNum/extension
        run: |
          npm run pack:store -- --no-build
          unzip -l ../dist/store/printnum-*.zip | grep -qE '^ *[0-9]+ .* manifest\.json$'

      - name: Артефакты сборки расширения
        uses: actions/upload-artifact@v7
        with:
          name: extension-build
          path: |
            cPrintNum/extension/output/chrome-mv3
            cPrintNum/dist/store/*.zip
            cPrintNum/dist/store/store-logo-300.png
          retention-days: 7

  # ---------------------------------------------------------------------------
  smoke:
    name: Smoke-тесты API (Wine)
    runs-on: ubuntu-latest
    needs: server
    steps:
      - uses: actions/checkout@v7

      - name: Артефакты exe
        uses: actions/download-artifact@v8
        with:
          name: server-exe
          path: cPrintNum

      - name: Wine + xvfb
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq wine wine64 xvfb lsof >/dev/null
          wine --version

      - name: Запуск службы и 27 проверок API
        working-directory: cPrintNum
        env:
          WINEPREFIX: ${{ github.workspace }}/.wine-printnum
          WINEDEBUG: "-all"
          # без этого wine может показать диалог установки Gecko/Mono и зависнуть
          WINEDLLOVERRIDES: "mscoree,mshtml="
        run: |
          chmod +x wine-ctl.sh
          xvfb-run -a bash -c './wine-ctl.sh start && ./wine-ctl.sh test'
          status=$?
          ./wine-ctl.sh stop || true
          exit $status

      - name: Логи при падении
        if: failure()
        run: |
          echo "=== wine ==="; tail -40 /tmp/printnum-wine.log 2>/dev/null
          echo "=== служба ==="; find . -name "log.txt" -path "*PrintNum*" -exec tail -40 {} \; 2>/dev/null
