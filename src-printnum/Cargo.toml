[package]
name = "printnum"
version = "3.0.0"
edition = "2021"
description = "PrintNum — печать ячеек Ozon (нативный Rust GUI, Windows 7+)"
authors = ["PrintNum"]
build = "build.rs"

# Целевая платформа — Windows 7 SP1 x64 и выше.
# На macOS/Linux крейт собирается только для разработки (GUI + HTTP + тесты);
# печать и функции принтера заменены заглушками, см. src/lib.rs.

[[bin]]
name = "printnum"
path = "src/main.rs"

# Конфигурация cargo-bundle для сборки .app/.dmg на macOS
# (только для разработки/тестов — печать на macOS недоступна).
# Сборка: cargo bundle --release  → target/release/bundle/osx/PrintNum.app
[package.metadata.bundle]
name = "PrintNum"
identifier = "ru.printnum.app"
icon = ["assets/icon.icns"]
version = "3.0.0"
category = "public.app-category.productivity"
short_description = "Печать ячеек Ozon (только для разработки на macOS)"
long_description = "PrintNum — нативный клиент печати ячеек Ozon. На macOS сборка предназначена только для разработки и не выполняет печать."
osx_minimum_system_version = "10.15"

[dependencies]
# Slint без default-фич: используется только software-рендерер.
# Причина — совместимость с Windows 7: femtovg требует OpenGL/Direct2D,
# а DirectWrite/Direct2D на Win7 ограничены. Software-рендерер рисует
# через GDI и не зависит от GPU/новых API.
#
# ВАЖНО (Windows 7): версия зафиксирована "=1.13.0".
# Начиная с i-slint-backend-winit 1.13.1 в граф попадает windows ^0.61,
# а с 1.14.0 — windows ^0.62. Эти биндинги объявляют
# SystemParametersInfoForDpi через `link!` (статический импорт user32.dll),
# которого НЕТ в Windows 7 — процесс падает с ошибкой
# "Точка входа в процедуру SystemParametersInfoForDpi не найдена".
# В 1.13.0 windows-крейт в Windows-граф не попадает вовсе.
slint = { version = "=1.13.0", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-software",
] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tiny_http = "0.12"

# Windows — реальная работа с принтером (Win32 GDI + Spooler).
# На macOS/Linux этот блок не подключается: модули используют заглушки.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_Security",
    "Win32_Graphics_Printing",
    "Win32_System_LibraryLoader",
    "Win32_System_Console",
] }

[build-dependencies]
slint-build = "=1.13.0"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true